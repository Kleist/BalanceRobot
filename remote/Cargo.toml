[package]
name = "balance-remote"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "BBC micro:bit v2 tilt remote for the balance robot"
publish = false

# Own workspace: this crate only builds for the Cortex-M4F target (nRF52833), so it stays
# out of the host workspace in the repo root, like firmware/.
[workspace]

[dependencies]
# Low-level Cortex-M access. The critical-section implementation (which defmt-rtt and
# embassy-sync need) comes from nrf-mpsl, see there.
cortex-m = "0.7"
# Startup code: vector table, copies .data / zeroes .bss, then calls our `#[entry]` fn.
cortex-m-rt = "0.7"
# Logging framework: the chip sends only an index into a string table plus the raw
# arguments; probe-rs looks the format string up in the ELF on the host and formats it.
defmt = "1"
# Transport for defmt: a ring buffer in RAM that the debug probe reads while the CPU runs.
defmt-rtt = "1"
# Panic handler: logs the panic message over defmt and makes probe-rs exit with an error.
panic-probe = { version = "1", features = ["print-defmt"] }
# Embassy HAL for the nRF52833: GPIO with async edge waits (`gpiote`), and the time driver
# for `embassy-time` on RTC1, a 32.768 kHz low-power counter (`time-driver-rtc1`).
# `nfc-pins-as-gpio`: P0.09/P0.10 are edge-connector pins on the micro:bit, not an NFC
# antenna. The choice lives in UICR (flash, only cleared by a full erase), which the
# micro:bit's earlier firmware already set to GPIO; without the feature embassy-nrf asks
# for NFC and warns at every start that it can't change UICR.
# Not microbit-bsp: its latest release (0.4) is built on embassy-nrf 0.4, while the BLE
# stack we need later (nrf-sdc 0.4, trouble-host 0.8) needs embassy-nrf 0.11.
embassy-nrf = { version = "0.11", features = ["nrf52833", "gpiote", "time-driver-rtc1", "nfc-pins-as-gpio", "defmt"] }
# Async executor: `platform-cortex-m` + `executor-thread` run the tasks in thread mode and
# sleep the CPU (WFE) while all of them wait.
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
# Async `Timer` and `Ticker`; `Delay` for the LSM303AGR driver's mode-change waits.
embassy-time = { version = "0.5", features = ["defmt"] }
# Driver for the LSM303AGR accelerometer/magnetometer on the micro:bit's internal I2C.
# `async`: its methods become `async fn`s over the embedded-hal-async I2C trait, which
# embassy-nrf's TWIM driver implements, so the task sleeps during each transfer.
lsm303agr = { version = "1.1", features = ["async"] }
# `StaticCell`: hands out a `&'static mut` to a value once, at runtime, without `unsafe`
# (the I2C driver's RAM buffer must live as long as the driver).
static_cell = "2"
# Our own hardware-independent logic (tilt -> command, later the packet format): unit-tested
# on the host in the root workspace, compiled into the remote from source here.
balance-core = { path = "../balance-core" }
# BLE, three layers as on the robot (see src/ble.rs): Nordic's SoftDevice Controller (a
# closed-source link-layer library, linked in as a static library) with the
# Multiprotocol Service Layer under it (MPSL: radio timing, clocks, the high-priority
# interrupts), wrapped by `nrf-sdc` / `nrf-mpsl`; `trouble-host` on top, as on the robot.
# `multirole` (= `central` + `peripheral`): the SoftDevice Controller comes as three
# libraries. We only need the central role (scan and connect; the robot is the
# peripheral), but the `central` library lacks extended scanning, which trouble-host's
# runner references (`LeSetExtScanEnable`), so it doesn't link. The linker keeps only
# what is used, so the bigger library costs little flash.
nrf-sdc = { version = "0.4", features = ["nrf52833", "multirole", "defmt"] }
# `critical-section-impl`: MPSL's radio interrupts must run on time, so a critical section
# (used by defmt-rtt, embassy-sync, ...) may not simply disable every interrupt, as
# cortex-m's single-core one does. MPSL's masks all interrupts except its own three.
nrf-mpsl = { version = "0.4", features = ["nrf52833", "defmt", "critical-section-impl"] }
# Host: `central` (connect), `scan` (hear advertisements), `gatt` (the GATT client that
# writes the packet characteristic). Default packet pool as on the robot.
trouble-host = { version = "0.8", default-features = false, features = ["central", "scan", "gatt", "defmt", "default-packet-pool"] }
# `Signal`: hands the robot's address from the scan callback to the central task.
embassy-sync = "0.8"
# `select`: runs the GATT client's receive loop next to the writes.
embassy-futures = "0.1"

# Same policy as [workspace.lints] in the root Cargo.toml (and firmware/, web/Cargo.toml); keep the four in sync.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2       # debug info (and the defmt string table) stays on the host, it is not flashed
lto = "fat"
codegen-units = 1
