# Pins the Rust version so local builds and CI use the same compiler and lints.
# rustup reads this file and installs everything listed automatically.
[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy", "llvm-tools"]
# ESP32-C3 (robot firmware) and nRF52833 (micro:bit remote).
targets = ["riscv32imc-unknown-none-elf", "thumbv7em-none-eabihf"]
