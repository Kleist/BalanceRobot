[package]
name = "balance-robot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "ESP32-C3 firmware: hardware glue around balance-core"
publish = false

# Own workspace: this crate only builds for the RISC-V target, so it stays out of the
# host workspace in the repo root (which runs host tests and clippy on all targets).
[workspace]

[dependencies]
# `unstable` is required by esp-rtos (it builds on esp-hal APIs that are not yet covered by semver).
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
# Runs the Embassy executor on top of esp-hal and provides the time driver (Timer/Ticker) from a hardware timer.
esp-rtos = { version = "0.4", features = ["esp32c3", "embassy"] }
# Async task executor: we only use its `#[task]` macro and `Spawner`; esp-rtos supplies the executor
# itself, so no `platform-*` / `executor-*` features here.
embassy-executor = "0.10"
# Async `Timer` and `Ticker`.
embassy-time = "0.5"
# Writes the app descriptor the ESP-IDF 2nd stage bootloader expects (espflash refuses images without it).
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
# println! over the USB-Serial-JTAG only: never touch UART0 (GPIO20/21 are IN3/IN4 on the L298N).
esp-println = { version = "0.18", default-features = false, features = ["esp32c3", "jtag-serial", "critical-section"] }
# Driver for the onboard ICM-42670-P IMU, built on the embedded-hal 1.0 I2C trait that esp-hal implements.
icm42670 = "0.2"
# Panic handler that prints the panic message and a backtrace.
esp-backtrace = { version = "0.20", features = ["esp32c3", "panic-handler", "println"] }

# Same policy as [workspace.lints] in the root Cargo.toml; keep the two in sync.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
# Unoptimized Rust is very slow and large on a microcontroller.
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2       # debug info stays on the host, it is not flashed
lto = "fat"
codegen-units = 1
