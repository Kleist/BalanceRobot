[package]
name = "balance-robot"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "ESP32-C3 firmware: hardware glue around balance-core"
publish = false
# `cargo run` without `--bin` runs the experiment that never drives the motors. The
# others have aliases in `.cargo/config.toml` (`cargo balance`, `cargo sign-check`, ...).
default-run = "imu_log"

# Own workspace: this crate only builds for the RISC-V target, so it stays out of the
# host workspace in the repo root (which runs host tests and clippy on all targets).
[workspace]

# No test harness on the bare-metal target: logic is tested on the host in balance-core and
# sim. The binaries in src/bin (one per experiment) are found automatically.
[lib]
test = false
doctest = false
bench = false

[dependencies]
# `unstable` unlocks drivers whose API may still change in minor releases; we need it for
# LEDC (motor PWM; the ESP32-C3 has no MCPWM) and esp-rtos.
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
# Runs the Embassy executor on top of esp-hal and provides the time driver (Timer/Ticker) from a hardware timer.
# `esp-radio` + `esp-alloc`: also a preemptive scheduler with threads for the radio
# firmware (Espressif's BLE controller is a binary blob that expects an RTOS).
esp-rtos = { version = "0.4", features = ["esp32c3", "embassy", "esp-radio", "esp-alloc"] }
# The radio driver: Espressif's BLE controller, wrapped as an HCI transport (`BleConnector`).
# A beta, so pinned exactly (1.0.0-beta.2 was yanked); `unstable` for the BLE driver.
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32c3", "ble", "unstable"] }
# Heap allocator: the BLE controller allocates its buffers at runtime.
esp-alloc = "0.11"
# BLE host stack (GAP, later GATT) on top of any HCI controller. Only the peripheral role:
# the robot advertises and gets connected to, it never scans.
trouble-host = { version = "0.8", default-features = false, features = ["peripheral", "default-packet-pool"] }
# HCI types and `ExternalController`, which drives a controller over an HCI transport.
# 0.10 is what trouble-host 0.8 uses; its `Transport` trait (from `bt-hci-transport` 0.1) is
# the one esp-radio's `BleConnector` implements.
bt-hci = "0.10"
# `join`: runs the BLE host's runner and the advertising code side by side in one task.
embassy-futures = "0.1"
# Async task executor: we only use its `#[task]` macro and `Spawner`; esp-rtos supplies the executor
# itself, so no `platform-*` / `executor-*` features here.
embassy-executor = "0.10"
# Async `Timer` and `Ticker`.
embassy-time = "0.5"
# `Channel`: the queue from the sample loop to the log task.
embassy-sync = "0.8"
# Fixed-capacity `String` (no allocator in no_std) to format a log line into.
heapless = "0.9"
# The async `Write` trait (`write_all`) that esp-hal's USB-Serial-JTAG driver implements.
embedded-io-async = "0.7"
# `StaticCell`: hands out a `&'static mut` to a value once, at runtime, without `unsafe`.
static_cell = "2"
# Writes the app descriptor the ESP-IDF 2nd stage bootloader expects (espflash refuses images without it).
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
# println! over the USB-Serial-JTAG only: never touch UART0 (GPIO20/21 are IN3/IN4 on the L298N).
esp-println = { version = "0.18", default-features = false, features = ["esp32c3", "jtag-serial", "critical-section"] }
# Driver for the onboard ICM-42670-P IMU, built on the embedded-hal 1.0 I2C trait that esp-hal implements.
icm42670 = "0.2"
# Our own hardware-independent logic (pitch math, later filters and PID): unit-tested on the
# host in the root workspace, compiled into the firmware from source here.
balance-core = { path = "../balance-core" }
# Panic handler that prints the panic message and a backtrace.
esp-backtrace = { version = "0.20", features = ["esp32c3", "panic-handler", "println"] }

# Same policy as [workspace.lints] in the root Cargo.toml (and remote/Cargo.toml); keep the three in sync.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
# Unoptimized Rust is very slow and large on a microcontroller.
opt-level = "s"

[profile.release]
opt-level = "s"
debug = 2       # debug info stays on the host, it is not flashed
lto = "fat"
codegen-units = 1

[[bin]]
name = "imu_log"
test = false
bench = false

[[bin]]
name = "deadband_test"
test = false
bench = false

[[bin]]
name = "motor_check"
test = false
bench = false

[[bin]]
name = "sign_check"
test = false
bench = false

[[bin]]
name = "balance"
test = false
bench = false
